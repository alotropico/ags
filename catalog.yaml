format: 2

rules:
  - id: core
    tier: strong
    install: always
  - id: tmp-conventions
    tier: soft
    install: always

skills:
  - id: plan-work
    install: always
    keywords: [plan, planning, architecture]
  - id: write-commit-diff
    install: always
  - id: report-usage
    install: always
  - id: ui-library-css
    install: detected
    when:
      any:
        - package: "@platform/ui-library"
    includes: [css-authoring-conventions, css-theme-tokens]
    keywords: [css, ui, theme, tokens]
  - id: css-authoring-conventions
    install: opt-in
    includes: [css-cleanup]
    keywords: [css, scss, styles, styling]
  - id: css-cleanup
    install: opt-in
    params: [checks.type, checks.lint, checks.prettier]
    keywords: [css, cleanup, unused, modules, audit, variables]
  - id: css-theme-tokens
    install: opt-in
    keywords: [css, theme, tokens]
  - id: git-cleanup
    install: opt-in
    params: [git.mainBranch]
    keywords: [git, branches, cleanup]
  - id: ship
    install: opt-in
    includes: [commit-granular, start-branch]
    params: [git.mainBranch, git.ticketPrefix]
    keywords: [ship, push, publish, review]
  - id: check
    install: opt-in
    params: [checks.type, checks.lint, checks.prettier]
    keywords: [check, typecheck, lint, prettier]
  - id: commit-granular
    install: opt-in
    keywords: [commit, commits, git]
  - id: start-branch
    install: opt-in
    params: [git.mainBranch, git.ticketPrefix]
    keywords: [branch, ticket, git]

settings:
  - key: git.mainBranch
    type: string
    required: true
    description: Trunk branch that feature branches start from and merge into.
  - key: git.ticketPrefix
    type: string
    default: ""
    description: Prefix for ticket ids in branch names and commit subjects. Empty means no ticket part.
  - key: checks.type
    type: string
    default: ""
    description: package.json script that runs the type check. Empty means not configured.
  - key: checks.lint
    type: string
    default: ""
    description: package.json script that runs the linter. Empty means not configured.
  - key: checks.prettier
    type: string
    default: ""
    description: package.json script that checks formatting without writing files. Empty means not configured.
